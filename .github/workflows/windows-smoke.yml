name: Windows smoke

on: pull_request

permissions:
  contents: read

jobs:
  window:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --engine-strict
      - name: Run window smoke
        id: smoke
        shell: pwsh
        env:
          PFC_SMOKE_SCREENSHOT: ${{ runner.temp }}/pfc-smoke-window.png
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'pfc-smoke.log'
          npm.cmd run test:smoke 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $screenshot = Get-Item -LiteralPath $env:PFC_SMOKE_SCREENSHOT
          if ($screenshot.Length -eq 0) { throw 'Window smoke screenshot is empty.' }
      - name: Upload window smoke evidence
        if: ${{ !cancelled() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pfc-smoke.log
            ${{ runner.temp }}/pfc-smoke-window.png
          if-no-files-found: error
      - name: Run Electron end-to-end test
        run: npm run test:e2e
      - name: Install browser for offline mockup acceptance
        run: npx --no-install playwright install chromium --only-shell
      - name: Run offline mockup acceptance
        run: node --test tests/acceptance/p0-04-mockup.mjs
